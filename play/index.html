<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pixl</title>
    <!-- Generated by scripts/make-icon.ps1 (the same ship as the Studio's app icon). -->
    <link rel="icon" href="/pixl-releases/play/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/pixl-releases/play/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/pixl-releases/play/apple-touch-icon.png" />
    <script type="module" crossorigin src="/pixl-releases/play/assets/index-ztucZKFy.js"></script>
    <link rel="stylesheet" crossorigin href="/pixl-releases/play/assets/index-CAqF3Uuz.css">
  </head>
  <body>
    <main id="app">
      <section id="loading" class="panel">
        <p>Loading Pixl…</p>
      </section>

      <section id="message" class="panel" hidden>
        <h1 id="messageTitle"></h1>
        <ul id="problems"></ul>
        <button id="tryExample" type="button" hidden>Try an example</button>
      </section>

      <section id="stage" hidden>
        <h1 id="title"></h1>
        <div class="frame">
          <canvas id="game" aria-label="The game"></canvas>
          <button id="play" type="button" aria-label="Play">▶ Tap to play</button>
        </div>
        <p id="hint" class="muted">Arrow keys and space</p>
        <p id="status" class="muted" aria-live="polite"></p>
        <details id="codeDetails">
          <summary>See the code</summary>
          <pre id="code"></pre>
        </details>
        <p class="remix"><a id="openInStudio" href="#">✏ Open in Studio</a> <span class="muted">— change it and make it yours</span></p>
      </section>

      <footer class="muted">
        Made with <a href="https://github.com/dkcharles/pixl-releases">Pixl</a> — get Pixl Studio and make your own.
      </footer>
    </main>
  </body>
</html>
